    function pipefn(...fns){
        let initialValue
        return function(initialvalue){
            let accumulator = initialValue;
            // PHASE 2: Loop through each function in fns
            for (let fn of fns) {
                accumulator=fn(initialvalue)
                pipeanswer.textContent=pipeanswer.textContent+ `-> ${accumulator}(next)`

            }
            return accumulator;
        }

                accumulator=fn(initialvalue)
                compositeanswer.textContent=compositeanswer.textContent+ `-> ${accumulator}(back)`

            }
        }
    }

        return function curried(...args){
            if(args.length>=fn.length){
                return fn(...args)
            }
            else{
