        const CartModule = (function() {
                let items=[]
                function clear(){
                    items=[]
                }
                function additem(item) { //{ id, name, price, quantity }
                    items.push(item)
                }
                function removeitem(item){
                    items.pop(item)
                }
                function getitems(){
                    return [...items] //but its a copy / view of items.. they cannot maippulate it
                }
                function gettotal() {
                    let sum=0
                    items.forEach(item => {
                        sum+=(item.price*item.quantity)
                    });
                    console.log(sum);
                    return sum
                }
                function updateQuantity(id, newQty) {
                     items.forEach(item => {
                        if(id==item.id){
                            item.quantity=newQty
                        }
                     })
                }
                return {clear,additem,removeitem,updateQuantity,getitems,gettotal}
            })();
         
            console.log(CartModule.getitems());
             
            CartModule.additem({ id:1, name:"milk", price:30, quantity:2 })
            CartModule.additem({ id:2, name:"curd", price:40, quantity:1 })
            CartModule.additem({ id:3, name:"beans", price:50, quantity:1 })
            console.log(CartModule.getitems());
            CartModule.removeitem({ id:2, name:"curd", price:40, quantity:1 })
            CartModule.gettotal()
            CartModule.updateQuantity(1,10)
            let itemsduplicate=CartModule.getitems();
            itemsduplicate.push({ id: 99, name: "hacked", price: 0, quantity: 1 });
