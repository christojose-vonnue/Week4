    // Task 3 (40 min) - Factory & Builder Patterns

    class QueryBuilder {
        constructor() {
            this.tablename=''
            this.conditions = []
            this.fields = '*'
            this.limitNum = null
        }
        from(table){
            this.tablename=table
            return this
        }
        where(conditions,delimiter="AND"){
            // console.log(conditions);
            // console.log(conditions.join(` ${delimiter} `));
            this.conditions=conditions.join(` ${delimiter} `)
            return this
        }
        select(...fields){
            this.fields=fields.join(",") // I guess if not provided, then we select all field *
            return this
        }
        limit(number){
            this.limitNum = number
            return this
        }
        build(){
            let query=""
            if(this.tablename==''){
                console.warn("No user name given.. Invalid query");
                return
            }
            query=`SELECT ${this.fields} FROM ${this.tablename}`
            // console.log(this.conditions);
            // console.log(this.limitNum);
            
            if(this.conditions.length){
                query+=` WHERE ${this.conditions}`
            }
            if(this.limitNum){
                query+=` LIMIT ${this.limitNum}`
            }
            console.log(query);
            return query
           }
    }

    const obj=new QueryBuilder()

    function createNotification({ type='info', message='', duration=3000, dismissible=true}={}){
        
        let show=()=>{
            let timerid=setTimeout(() => {
                if(type=='info'){
                    console.log(message);
                }
                else if(type=='warn'){
                    console.warn(message);
                }
                else if(type=='error'){
                    console.error(message);
                }
                else{
                    alert("Invalid type")
                }
            }, duration);
            console.log(timerid);
            
            let dismiss=()=>{
                console.log(timerid);
                if (timerid && dismissible) {
                    clearTimeout(timerid)
                    console.log(("--check if Dismissed msg appeared"));
                    
                }
            }
            return {dismiss}
            
        }
        
        let hello=()=>{
            console.log("hello");
        }


        const Notificationobject={show,hello}
        return Notificationobject
    }
    const notification1=createNotification({type:"warn",message:"Message 1",duration:1000})
    notification1.show()
    notification1.hello()

    const dismissobj=notification2.show()
    // const dismissobj=notification2.show
    console.log(dismissobj);
    dismissobj.dismiss()
