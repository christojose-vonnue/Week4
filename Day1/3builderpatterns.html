    // Task 3 (40 min) - Factory & Builder Patterns

    class QueryBuilder {
        constructor() {
            this.tablename=''
            this.conditions = []
            this.fields = '*'
            this.limitNum = null
        }
        from(table){
            this.tablename=table
            return this
        }
        where(conditions,delimiter="AND"){
            // console.log(conditions);
            // console.log(conditions.join(` ${delimiter} `));
            this.conditions=conditions.join(` ${delimiter} `)
            return this
        }
        select(...fields){
            this.fields=fields.join(",") // I guess if not provided, then we select all field *
            return this
        }
        limit(number){
            this.limitNum = number
            return this
        }
        build(){
            let query=""
            if(this.tablename==''){
                console.warn("No user name given.. Invalid query");
                return
            }
            query=`SELECT ${this.fields} FROM ${this.tablename}`
            // console.log(this.conditions);
            // console.log(this.limitNum);
            
            if(this.conditions.length){
                query+=` WHERE ${this.conditions}`
            }
            if(this.limitNum){
                query+=` LIMIT ${this.limitNum}`
            }
            console.log(query);
            return query
           }
    }

    const obj=new QueryBuilder()
    console.log("**********");
    obj.build()
    obj.from("students")
    obj.build()
    // obj.from("dummy").build()
    obj.where(["marks>20","grade>8.0"],"OR").build()
    obj.select("name")
    obj.limit(3).build()
    obj.from("students_copy").build()
