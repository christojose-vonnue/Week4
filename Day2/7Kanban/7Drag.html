<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="7.js" defer></script>
        <style>
        #task-container{
            display: flex;
            border: solid 2px darkmagenta;
            border-radius: 20px;
            min-height: 20vh;
        }
        #to-do,#in-progress,#done{
            display: flex;
            border: solid 2px darkslateblue;
            border-radius: 20px;
            min-height: 20vh;
            flex-direction: column; 
            margin: 30px; 
            width: 30vw ;        
        }
        #in-progress{
            border: solid 2px darkred;
        }
        .card{
            display: flex;
            flex-direction: column;
            background-color: rgba(171, 163, 179, 0.432);
            font-size: 18px;
            margin: 12px;
            border-radius: 12px;
        }
        #add{
            align-self: center;
            width: 40px;
            height: 40px;
            font-size: 24px;
        }
        .removetask{
            align-self: center;
            width: 120px;
            height: 30px;
            font-size: 14px;
        }
        .placeholder {
            background-color: rgba(83, 76, 90, 0.432);
            font-size: 18px;
            margin: 12px;
            border-radius: 12px;
        }
        .keyboardselected {
            border: 4px dashed #ff9900 !important;
        }
    </style>
</head>
<body>
    <div id="task-container">
    <div id="to-do"  tabindex="0">
        
        <button id="add">+</button>
    </div>
    <div id="in-progress"  tabindex="0"></div>
    <div id="done" tabindex="0"></div> 
    </div>

</body>
</html>
